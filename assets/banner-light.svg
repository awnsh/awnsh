  </defs>
  <rect width="900" height="260" rx="18" fill="#ffffff"/>
  <rect width="900" height="260" rx="18" fill="url(#dots)" opacity=".7"/>
  <rect width="900" height="260" rx="18" fill="url(#g)"/>
  <rect x=".5" y=".5" width="899" height="259" rx="17.5" fill="none" stroke="#d1d9e0"/>
  <g class="t">
    <text x="56" y="78" font-size="15" letter-spacing="3" fill="#C8553D" font-weight="600">ENGINEERING @ PURDUE · FOUNDER OF NOMA</text>
    <text x="54" y="148" font-size="64" font-weight="700" fill="#1f2328" letter-spacing="-1.5">Ansh Ukani<tspan fill="#C8553D" class="cursor">_</tspan></text>
    <text x="56" y="196" font-size="19" fill="#59636e">Building a computer interface that learns your workflow</text>
    <text x="56" y="222" font-size="19" fill="#59636e">instead of making you adapt to it.</text>
  </g>
