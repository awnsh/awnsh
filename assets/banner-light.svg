<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <radialGradient id="g" cx="78%" cy="30%" r="60%">
      <stop offset="0" stop-color="#C8553D" stop-opacity=".38"/>
      <stop offset="1" stop-color="#C8553D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#d1d9e0"/>
    </pattern>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .cursor{animation:blink 1.1s steps(1) infinite}
