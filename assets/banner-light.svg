    <rect x="42" y="56" width="24" height="24" rx="6" fill="#d1d9e0"/>
    <rect x="72" y="56" width="24" height="24" rx="6" fill="#d1d9e0"/>
    <rect x="102" y="56" width="26" height="24" rx="6" fill="#d1d9e0"/>
